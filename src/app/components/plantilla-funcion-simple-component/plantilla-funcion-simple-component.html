<!-- Código del profe -->
<h1>Plantilla función simple</h1>
<form #plantillaform="ngForm">
    <label>Seleccione una función</label>
    <select name="selectfuncion" #selectfuncion class="form-control">
        @for (fun of funciones; track fun){
        <option>{{fun}}</option>
        }
    </select>
    <button (click)="mostrarPlantilla()">Mostrar plantilla</button>
</form>
<table class="table table-bordered">
    <thead>
        <tr>
            <th>Apellido</th>
            <th>Funcion</th>
            <th>Turno</th>
            <th>Salario</th>
        </tr>
    </thead>
    @for (person of personas; track person){
    <tr>
        <td>{{person.apellido}}</td>
        <td>{{person.funcion}}</td>
        <td>{{person.turno}}</td>
        <td>{{person.salario}}</td>
    </tr>
    }
</table>
