<div class="container mt-4">
    <h1 class="mb-4">Plantilla función múltiple</h1>

    <form class="mb-4">
        <div class="mb-3">
            <label class="form-label fw-bold">Seleccione una función</label>
            <select multiple size="3" #selectfuncion class="form-select">
                @for (fun of funciones; track fun){
                <option [value]="fun">{{fun}}</option>
                }
            </select>
        </div>
        <button type="button" class="btn btn-primary" (click)="mostrarPlantilla()">Mostrar plantilla</button>
    </form>

    <div class="table-responsive">
        <table class="table table-striped table-hover table-bordered align-middle">
            <thead class="table-primary">
                <tr>
                    <th>Apellido</th>
                    <th>Función</th>
                    <th>Turno</th>
                    <th>Salario</th>
                </tr>
            </thead>
            <tbody>
                @for (person of personas; track person){
                <tr>
                    <td>{{person.apellido}}</td>
                    <td>{{person.funcion}}</td>
                    <td>{{person.turno}}</td>
                    <td>{{person.salario}}</td>
                </tr>
                }
            </tbody>
        </table>
    </div>
</div>
